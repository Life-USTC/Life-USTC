name: CI

# Temporary visual-evidence branch only. Never merge this carrier to main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios150-native-visual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native_visual_pair:
    name: Native calendar pair (${{ matrix.device }}, ${{ matrix.locale }})
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        device: [iPhone, iPad]
        locale: [en, zh-Hans]
    env:
      VISUAL_LOCALE: ${{ matrix.locale }}
      VISUAL_DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preserve the identical temporary visual carrier
        run: |
          mkdir -p "$RUNNER_TEMP/ios150-native-visual-carrier"
          cp .github/native-calendar-visual/* "$RUNNER_TEMP/ios150-native-visual-carrier/"
          cp .github/workflows/ci.yaml .github/workflows/screenshot.yaml \
            "$RUNNER_TEMP/ios150-native-visual-carrier/"

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: SourcePackages
          key: ios150-visual-spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Setup native build tools
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Create and normalize the owned native simulator
        run: python3 "$RUNNER_TEMP/ios150-native-visual-carrier/simulator.py" create

      - name: Run original and candidate native visual fixtures sequentially
        run: bash "$RUNNER_TEMP/ios150-native-visual-carrier/run-pair.sh"

      - name: Dispose only the exact owned simulator and retain its receipt
        if: always()
        run: python3 "$RUNNER_TEMP/ios150-native-visual-carrier/simulator.py" cleanup

      - name: Retain original results and provenance even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios150-native-visual-${{ matrix.device }}-${{ matrix.locale }}-${{ github.run_id }}
          path: NativeVisualResults/
          if-no-files-found: error
