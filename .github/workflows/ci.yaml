name: CI

# Temporary visual-evidence branch only. Never merge this carrier to main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios150-native-visual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native_visual_pair:
    name: Native calendar pair (${{ matrix.device }}, ${{ matrix.locale }})
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        device: [iPhone, iPad]
        locale: [en, zh-Hans]
    env:
      VISUAL_LOCALE: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preserve the identical temporary visual carrier
        run: |
          mkdir -p "$RUNNER_TEMP/ios150-native-visual-carrier"
          cp .github/native-calendar-visual/CalendarSundayNativeRenderTests.swift \
            .github/native-calendar-visual/CalendarSundayVisualCaptureTests.swift \
            .github/native-calendar-visual/run-pair.sh "$RUNNER_TEMP/ios150-native-visual-carrier/"

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: SourcePackages
          key: ios150-visual-spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Setup native build tools
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Create and normalize the owned native simulator
        env:
          VISUAL_DEVICE: ${{ matrix.device }}
        run: |
          if [[ "$VISUAL_DEVICE" == iPad ]]; then
            device_type="iPad Pro 13-inch (M5)"
          else
            device_type="iPhone 17"
          fi
          TEST_DEVICE_ID=$(xcrun simctl create "Life-USTC visual $VISUAL_DEVICE $VISUAL_LOCALE" "$device_type")
          echo "TEST_DEVICE_ID=$TEST_DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$TEST_DEVICE_ID"
          xcrun simctl bootstatus "$TEST_DEVICE_ID" -b
          xcrun simctl ui "$TEST_DEVICE_ID" appearance light
          xcrun simctl status_bar "$TEST_DEVICE_ID" override --time "9:41" --batteryState charged --batteryLevel 100

      - name: Run original and candidate native visual fixtures sequentially
        run: bash "$RUNNER_TEMP/ios150-native-visual-carrier/run-pair.sh"

      - name: Retain original results and provenance even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios150-native-visual-${{ matrix.device }}-${{ matrix.locale }}-${{ github.run_id }}
          path: NativeVisualResults/
          if-no-files-found: error

      - name: Dispose the owned simulator
        if: always() && env.TEST_DEVICE_ID != ''
        run: |
          xcrun simctl shutdown "$TEST_DEVICE_ID" || true
          xcrun simctl delete "$TEST_DEVICE_ID"
