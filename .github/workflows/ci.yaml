name: CI

# Temporary Account-query diagnosis only. NEVER MERGE this carrier to main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios140-account-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  account_diagnostic:
    name: Account query diagnosis (${{ matrix.device }}, ${{ matrix.variant }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        device: [iPhone, iPad]
        variant: [baseline, scoped-query, cached-viewport]
    env:
      DIAGNOSTIC_DEVICE: ${{ matrix.device }}
      DIAGNOSTIC_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout the never-merge diagnostic carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the exact original failed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 59771f3c7dfc032cf53796c6df6108977e216286
          path: source
          persist-credentials: false

      - name: Cache the original source's Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source/SourcePackages
          key: ios140-account-spm-${{ runner.os }}-${{ hashFiles('source/project.yml') }}

      - name: Prepare native tools and the exactly owned simulator
        run: |
          brew install xcodegen
          xcodebuild -version
          python3 .github/native-account-diagnostic/simulator.py create

      - name: Run the original positive case, then separate negative controls
        run: bash .github/native-account-diagnostic/run.sh

      - name: Delete only this job's owned simulator
        if: always()
        run: python3 .github/native-account-diagnostic/simulator.py cleanup

      - name: Retain original native results and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios140-account-${{ matrix.device }}-${{ matrix.variant }}-${{ github.run_id }}
          path: AccountDiagnosticResults/
          if-no-files-found: error
