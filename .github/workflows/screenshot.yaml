name: Screenshots

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  snapshot:
    name: Generate iOS UI Screenshots (${{ matrix.locale }})
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        locale: [en-US, zh-Hans]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen --spec project.yml

      - name: Setup Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Setup Simulators
        run: |
          xcrun simctl create "iPhone 14 Pro Max" "iPhone 14 Pro Max"

      - name: Run Fastlane Snapshot
        env:
          TZ: Asia/Shanghai
          SNAPSHOT_LOCALE: ${{ matrix.locale }}
        run: |
          bundle exec fastlane snapshot --languages "$SNAPSHOT_LOCALE"

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots-${{ github.run_id }}-${{ matrix.locale }}
          path: screenshots/${{ matrix.locale }}/*.png
          if-no-files-found: warn

      - name: Upload snapshot logs artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-snapshot-logs-${{ github.run_id }}-${{ matrix.locale }}
          path: ~/Library/Logs/snapshot/**
          if-no-files-found: warn

  publish:
    name: Validate and publish complete screenshot matrix
    needs: snapshot
    if: needs.snapshot.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download English screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-screenshots-${{ github.run_id }}-en-US
          path: screenshots/en-US

      - name: Download Chinese screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-screenshots-${{ github.run_id }}-zh-Hans
          path: screenshots/zh-Hans

      - name: Validate all 44 named screenshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          captures = re.findall(r'snapshot\("([^"]+)"\)', Path("Tests/Life-USTC-UITests/Screenshot.swift").read_text())
          if len(captures) != 11 or len(set(captures)) != 11:
              raise SystemExit("Expected the original 11 unique screenshot calls")
          devices = ("iPhone 14 Pro Max", "iPad Pro 13-inch (M5)")
          expected = {
              Path("screenshots") / locale / f"{device}-{capture}.png"
              for locale in ("en-US", "zh-Hans")
              for device in devices
              for capture in captures
          }
          actual = set(Path("screenshots").rglob("*.png"))
          if actual != expected:
              raise SystemExit(f"Screenshot matrix mismatch: missing={sorted(map(str, expected - actual))}; unexpected={sorted(map(str, actual - expected))}")
          for path in sorted(expected):
              with path.open("rb") as image:
                  if image.read(8) != b"\x89PNG\r\n\x1a\n":
                      raise SystemExit(f"Invalid PNG: {path}")
          print("Validated 44 original named captures across both devices and languages")
          PY

      - name: Upload complete screenshots artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots-${{ github.run_id }}
          path: screenshots
          if-no-files-found: error

      - name: Publish screenshots to gh-pages (append-only)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./screenshots
          destination_dir: run-${{ github.run_id }}/screenshots
          keep_files: true

      - name: Build markdown summary and comment body (script)
        id: build_md
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          bash scripts/simulate_screenshot_comment.sh

      - name: Publish summary
        run: |
          cat screenshots_comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on Pull Request (sticky)
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          path: screenshots_comment.md
